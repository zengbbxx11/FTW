[package]
name = "ftw-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ftw-ipc.workspace = true
libsqlite3-sys = "0.30.1"
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror.workspace = true
tokio.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
base64 = "0.22"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
