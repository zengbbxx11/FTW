[package]
name = "ftw-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ftw-ipc.workspace = true
libsqlite3-sys = "0.30.1"
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror.workspace = true
tokio.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
base64 = "0.22"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging"] }

async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures-util = "0.3"
mail-parser = { version = "1", features = ["full_encoding"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
csv = "1"

[dev-dependencies]
tempfile = "3"
