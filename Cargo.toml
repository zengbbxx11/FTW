[workspace]
members = ["apps/desktop/src-tauri", "crates/ftw-ipc", "crates/ftw-core", "crates/ftw-mcp"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
ftw-ipc = { path = "crates/ftw-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
